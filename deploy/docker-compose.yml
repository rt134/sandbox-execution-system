version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sandbox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandbox}
      POSTGRES_DB: ${POSTGRES_DB:-sandbox}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sandbox-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  squid:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: sandbox-squid
    ports:
      - "3128:3128"
    restart: unless-stopped

  sandbox-engine:
    build:
      context: ../sandbox-engine
      dockerfile: Dockerfile
    container_name: sandbox-engine
    ports:
      - "8080:8080"
    environment:
      - SANDBOX_DRIVER=docker
      - SANDBOX_POSTGRES_URL=postgresql://sandbox:sandbox@postgres:5432/sandbox
      - SANDBOX_REDIS_URL=redis://redis:6379/0
      - SANDBOX_WARM_POOL_SIZE=2
      - SANDBOX_HTTP_PROXY=http://squid:3128
      - SANDBOX_HTTPS_PROXY=http://squid:3128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces-data:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      squid:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  workspaces-data:
