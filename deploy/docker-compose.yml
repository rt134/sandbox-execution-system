version: "3.8"

services:
  postgres:
    image: postgres:16-alpine@sha256:d8cfa1a260f85eb35dd0c9e6d081f2ec8c6c5ea3e3bb5ec49efce1338df29ad7
    container_name: sandbox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandbox}
      POSTGRES_DB: ${POSTGRES_DB:-sandbox}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sandbox} -d ${POSTGRES_DB:-sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:c221c5b4d7f57a06a2ff2d250f2495d909bb24c3df07e780a47eb38b97d259e8
    container_name: sandbox-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  squid:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: sandbox-squid
    ports:
      - "127.0.0.1:3128:3128"
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.1@sha256:90538a74e14f6b283c7ccfa89ef64ce49efda8b1398863f6a27e7ff5141c2c2f
    container_name: sandbox-docker-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - DELETE=1
      - GET=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - PING=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  sandbox-engine:
    build:
      context: ../sandbox-engine
      dockerfile: Dockerfile
    container_name: sandbox-engine
    ports:
      - "8080:8080"
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - SANDBOX_ENVIRONMENT=production
      - SANDBOX_DRIVER=docker
      - SANDBOX_DOCKER_RUNTIME=${SANDBOX_DOCKER_RUNTIME:-runsc}
      - ALLOW_INSECURE_DOCKER_PRODUCTION=${ALLOW_INSECURE_DOCKER_PRODUCTION:-0}
      - SANDBOX_WORKSPACES_ROOT=/workspaces
      - SANDBOX_POSTGRES_URL=postgresql://${POSTGRES_USER:-sandbox}:${POSTGRES_PASSWORD:-sandbox}@postgres:5432/${POSTGRES_DB:-sandbox}
      - SANDBOX_REDIS_URL=redis://redis:6379/0
      - SANDBOX_API_KEY=${SANDBOX_API_KEY:?Error: SANDBOX_API_KEY must be set in production}
      - SANDBOX_ENCRYPTION_KEY=${SANDBOX_ENCRYPTION_KEY:?Error: SANDBOX_ENCRYPTION_KEY must be set in production}
      - SANDBOX_WARM_POOL_SIZE=2
      - SANDBOX_HTTP_PROXY=http://squid:3128
      - SANDBOX_HTTPS_PROXY=http://squid:3128
    volumes:
      - workspaces-data:/workspaces
    depends_on:
      docker-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      squid:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  workspaces-data:
