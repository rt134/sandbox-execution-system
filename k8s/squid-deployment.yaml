apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: sandbox-system
data:
  squid.conf: |
    http_port 3128

    # Safe ports
    acl SSL_ports port 443
    acl Safe_ports port 80          # http
    acl Safe_ports port 443         # https
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    # Whitelist allowed package registries & public APIs
    acl allowed_domains dstdomain .pypi.org .pythonhosted.org .npmjs.org .npmjs.com .registry.npmjs.org .github.com .huggingface.co
    http_access allow allowed_domains

    # Deny all other egress traffic by default
    http_access deny all

    # Disable proxy caching for pure filtering
    cache deny all
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid-proxy
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: squid-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: squid-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squid-proxy
    spec:
      containers:
        - name: squid
          image: ubuntu/squid:5.2-22.04_beta@sha256:8b4566d582f3c7333a59d8aa370e7a2df255a5b51239c0716616334a1599557a
          ports:
            - containerPort: 3128
              name: proxy
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1.0"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: squid-config
---
apiVersion: v1
kind: Service
metadata:
  name: squid-proxy
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: squid-proxy
spec:
  selector:
    app.kubernetes.io/name: squid-proxy
  ports:
    - protocol: TCP
      port: 3128
      targetPort: 3128
