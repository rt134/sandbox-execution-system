apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-engine-egress
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-engine
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandboxes
      ports:
        - protocol: TCP
          port: 5004
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squid-proxy-egress
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squid-proxy
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
