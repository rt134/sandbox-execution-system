apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandboxes-quota
  namespace: sandboxes
spec:
  hard:
    pods: "300"
    requests.cpu: "100"
    requests.memory: "250Gi"
    limits.cpu: "300"
    limits.memory: "600Gi"
    persistentvolumeclaims: "150"
    requests.storage: "500Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandboxes-limit-range
  namespace: sandboxes
spec:
  limits:
    - type: Container
      default:
        cpu: "1.0"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4.0"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: system-quota
  namespace: sandbox-system
spec:
  hard:
    pods: "20"
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "30"
    limits.memory: "60Gi"
