apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sandbox-engine-monitor
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-engine
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-engine
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
