apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation-policy
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      sandbox.managed: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic ONLY from the engine/gateway pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-engine
      ports:
        - protocol: TCP
          port: 5004
  egress:
    # Sandboxes resolve via Squid proxy env; no direct DNS egress.
    # Allow Egress ONLY to the Squid outbound proxy
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
