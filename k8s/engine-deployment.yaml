apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-engine
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: sandbox-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-engine
      containers:
        - name: engine
          image: sandbox-engine:v0.1.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SANDBOX_ENVIRONMENT
              value: "production"
            - name: SANDBOX_DRIVER
              value: "k8s"
            - name: SANDBOX_IMAGE
              value: "sandbox-base:latest"
            - name: SANDBOX_K8S_RUNTIME_CLASS
              value: ""
            - name: SANDBOX_K8S_IMAGE_PULL_POLICY
              value: "IfNotPresent"
            - name: SANDBOX_K8S_NAMESPACE
              value: "sandboxes"
            - name: SANDBOX_K8S_USE_PVC
              value: "true"
            - name: SANDBOX_HTTP_PROXY
              value: "http://squid-proxy.sandbox-system.svc.cluster.local:3128"
            - name: SANDBOX_HTTPS_PROXY
              value: "http://squid-proxy.sandbox-system.svc.cluster.local:3128"
            - name: SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: api-key
            - name: SANDBOX_TENANT_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: tenant-keys
            - name: SANDBOX_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: encryption-key
            - name: SANDBOX_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: postgres-url
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2.0"
              memory: "2Gi"
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-engine
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-engine
  ports:
    - protocol: TCP
      name: http
      port: 8080
      targetPort: 8080
    - protocol: TCP
      name: metrics
      port: 9090
      targetPort: 9090
