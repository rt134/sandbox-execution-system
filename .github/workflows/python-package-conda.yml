name: Python Package using Conda

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }} with Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: test-env

    - name: Install dependencies
      shell: bash -el {0}
      run: |
        conda install -y pytest flake8
        pip install -e ./sandbox-client
        pip install -e ./sandbox-engine
        pip install pip-audit

    - name: Audit Python dependencies (pip-audit)
      shell: bash -el {0}
      run: |
        pip-audit --desc on

    - name: Validate Kubernetes manifests (kubeconform)
      run: |
        curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin/
        kubeconform -summary -strict -kubernetes-version 1.30.0 k8s/

    - name: Lint with flake8
      shell: bash -el {0}
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=daemon/
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=daemon/

    - name: Build Docker sandbox image
      run: |
        docker build -t sandbox-base:latest daemon/

    - name: Run Trivy vulnerability scanner on Docker sandbox image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'sandbox-base:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: daemon/go.sum

    - name: Test Go daemon
      run: |
        cd daemon
        go vet ./...
        go test -v ./handlers

    - name: Create KinD Kubernetes Cluster
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: kind-sandbox
        node_image: kindest/node:v1.30.0

    - name: Load Sandbox Image & Apply K8s Manifests
      run: |
        kind load docker-image sandbox-base:latest --name kind-sandbox
        kubectl apply -f k8s/rbac.yaml
        kubectl apply -f k8s/resource-quota.yaml
        kubectl apply -f k8s/runtime-class.yaml || true

    - name: Test with pytest & load test
      shell: bash -el {0}
      env:
        SANDBOX_POSTGRES_URL: postgresql://sandbox:sandbox@localhost:5432/sandbox
        ENV: test
      run: |
        PYTHONPATH="sandbox-engine/src:sandbox-client/src" pytest sandbox-engine/tests/ sandbox-client/tests/
